services:
  company-wiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chuangran-company-wiki
    env_file:
      - .env
    environment:
      WIKI_PROJECT_ROOT: /data
      ACCESS_CONTROL_FILE: /data/access-control.json
    ports:
      - "8002:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
