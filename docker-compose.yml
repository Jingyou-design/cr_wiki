services:
  company-wiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chuangran-company-wiki
    env_file:
      - .env
    environment:
      WIKI_PROJECT_ROOT: /data
    ports:
      - "${WIKI_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
