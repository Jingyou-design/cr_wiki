<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="登录 DeepBook"
    />
    <title>登录 · DeepBook</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260727-6" />
  </head>
  <body>
    <main class="login-screen">
      <div class="login-layout">
        <section class="login-intro">
          <p class="eyebrow">KNOWLEDGE BASE SETUP</p>
          <h1>把公司资料变成<br />可检索的 DeepBook</h1>
          <p>
            上传整理后的公司资料包，系统会自动调用 Deep Agent
            按原目录生成一源一页的 DeepBook 草稿。
          </p>
        </section>

        <form class="login-card" id="loginForm">
          <span class="brand-mark" aria-hidden="true">CR</span>
          <div>
            <p class="eyebrow">DEPARTMENT ACCESS</p>
            <h2>登录 DeepBook</h2>
            <p>系统会根据账号所属部门加载对应的知识库访问权限。</p>
          </div>
          <label class="field">
            <span>用户名</span>
            <input
              id="loginUsername"
              type="text"
              autocomplete="username"
              maxlength="100"
              required
              autofocus
            />
          </label>
          <label class="field">
            <span>密码</span>
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              maxlength="256"
              required
            />
          </label>
          <p class="login-error" id="loginError" role="alert"></p>
          <button class="primary-button" id="loginButton" type="submit">
            <span>登录</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </form>
      </div>
    </main>
    <script type="module" src="/assets/js/login-page.js?v=20260730-manager2"></script>
  </body>
</html>
