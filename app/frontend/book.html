<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="浏览部门 DeepBook 资料" />
    <title>资料浏览 · DeepBook</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260729-book1" />
  </head>
  <body class="is-book">
    <div class="page-shell book-shell">
      <header class="topbar">
        <a
          class="brand"
          href="/chat"
          data-role-home
          aria-label="返回当前工作台"
        >
          <span class="brand-mark" aria-hidden="true">CR</span>
          <span>
            <strong>DeepBook</strong>
            <small>部门资料库</small>
          </span>
        </a>
        <div class="topbar-actions">
          <a class="text-link" href="/chat" data-role-home>返回工作台</a>
          <span class="user-chip" id="userChip"></span>
          <button class="text-button" id="logoutButton" type="button">
            退出登录
          </button>
        </div>
      </header>

      <main class="book-main">
        <section class="book-intro">
          <div>
            <p class="eyebrow">DEPARTMENT KNOWLEDGE</p>
            <h1>浏览完整项目资料</h1>
            <p>按目录查看当前部门可访问的制度、流程和项目文档。</p>
          </div>
          <div class="book-sync-chip">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span>内容与最新 DeepBook 同步</span>
          </div>
        </section>

        <section class="book-layout" aria-label="DeepBook资料浏览">
          <aside class="book-sidebar">
            <div class="book-sidebar-heading">
              <div>
                <span>资料目录</span>
                <small id="treeSummary">正在加载</small>
              </div>
            </div>
            <label class="book-search">
              <span aria-hidden="true">⌕</span>
              <input
                id="bookSearch"
                type="search"
                placeholder="搜索目录和页面"
                autocomplete="off"
              />
            </label>
            <nav class="book-tree" id="bookTree" aria-label="Wiki目录"></nav>
            <div class="book-tree-empty" id="bookTreeEmpty" hidden>
              当前账号没有可浏览的资料。
            </div>
          </aside>

          <section class="book-reader">
            <header class="book-reader-header">
              <nav
                class="book-breadcrumbs"
                id="bookBreadcrumbs"
                aria-label="当前位置"
              ></nav>
              <span class="book-page-state" id="bookPageState">等待选择</span>
            </header>

            <div class="book-document-wrap">
              <div class="book-loading" id="bookLoading">
                <span class="book-loading-mark" aria-hidden="true">✦</span>
                <strong>正在打开资料</strong>
                <p>正在从 DeepBook 读取最新页面。</p>
              </div>
              <article
                class="wiki-document markdown-body"
                id="wikiDocument"
                hidden
              ></article>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script type="module" src="/assets/js/book-page.js?v=20260730-manager2"></script>
  </body>
</html>
